name: Build Docker CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:
    paths:
      - '/*.html'


env:
  ECR_REPOSITORY: mysite
  CONTAINER_NAME: mysite

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    outputs:
      sha_tag: ${{ steps.set_tag.outputs.sha_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set SHA Tag
        id: set_tag
        run: |
          echo "sha_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t ${ECR_REPOSITORY}:${{ steps.set_tag.outputs.sha_tag }} .

      - name: Tag Docker image
        run: |
          docker tag ${ECR_REPOSITORY}:${{ steps.set_tag.outputs.sha_tag }} \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${ECR_REPOSITORY}:${{ steps.set_tag.outputs.sha_tag }}

          docker tag ${ECR_REPOSITORY}:${{ steps.set_tag.outputs.sha_tag }} \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${ECR_REPOSITORY}:latest

      - name: Push images
        run: |
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${ECR_REPOSITORY}:${{ steps.set_tag.outputs.sha_tag }}

          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${ECR_REPOSITORY}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 allsafe
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
            sudo docker login \
              --username AWS \
              --password-stdin \
              ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

            sudo docker pull \
              ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/mysite:${{ needs.build-and-push.outputs.sha_tag }}

            sudo docker stop mysite || true
            sudo docker rm mysite || true

            sudo docker run -d \
              --name mysite \
              --restart unless-stopped \
              -p 80:80 \
              ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/mysite:${{ needs.build-and-push.outputs.sha_tag }}

            sudo docker image prune -af